<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0;url=mailto:vitabeear@gmail.com">
  <title>Contacto — VITABEE</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #215845;
      color: #f2ddb2;
      font-family: 'Outfit', system-ui, -apple-system, sans-serif;
      text-align: center;
      padding: 1.5rem;
    }
    .card {
      max-width: 420px;
      padding: 2rem;
      border-radius: 16px;
      border: 1px solid rgba(248, 218, 82, 0.28);
      background: rgba(0, 0, 0, 0.12);
    }
    h1 {
      color: #f8da52;
      font-size: 1.35rem;
      margin: 0 0 0.75rem;
    }
    p {
      font-size: 0.95rem;
      line-height: 1.5;
      margin: 0 0 1.25rem;
    }
    a.btn {
      display: inline-block;
      background-color: #f8da52;
      color: #1e1e1c;
      font-weight: 700;
      text-decoration: none;
      padding: 0.75rem 1.4rem;
      border-radius: 12px;
      font-size: 0.95rem;
    }
  </style>
  <script>
    window.location.replace("mailto:vitabeear@gmail.com");
    setTimeout(function () {
      window.close();
    }, 800);
  </script>
</head>
<body>
  <div class="card">
    <h1>Abriendo tu correo...</h1>
    <p>Si no se abre automáticamente tu aplicación de email, hacé clic abajo para escribirnos a <strong>vitabeear@gmail.com</strong>:</p>
    <a class="btn" href="mailto:vitabeear@gmail.com">Enviar correo a VITABEE</a>
  </div>
</body>
</html>
